name: Unit Tests
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "18.19.0"
          - "18"
          - "20.6.0"
          - "20"
          - "22"
          - "24"
          - "25"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      # npm@11.0.0 drops support for Node.js v18
      # Install the latest npm compatible with this version of Node.js
      # - npm@11.1.0 supports: {"node":"^20.17.0 || >=22.9.0"}
      - run: npm install -g npm@"<11.0.0"
        if: ${{
          matrix.node_version == '18.19.0' ||
          matrix.node_version == '18' ||
          matrix.node_version == '20.6.0'
          }}

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm test 2>&1 | tee seal-test.log

      - name: Test summary
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' seal-test.log > seal-test.clean.log
          suites=$(awk '/^[[:space:]]*[0-9]+ passing/ {n++} END {print n+0}' seal-test.clean.log)
          passing=$(awk '/^[[:space:]]*[0-9]+ passing/ {s+=$1} END {print s+0}' seal-test.clean.log)
          failing=$(awk '/^[[:space:]]*[0-9]+ failing/ {s+=$1} END {print s+0}' seal-test.clean.log)
          pending=$(awk '/^[[:space:]]*[0-9]+ pending/ {s+=$1} END {print s+0}' seal-test.clean.log)
          echo "Mocha totals across ${suites} test runs: ${passing} passing, ${failing} failing, ${pending} pending"
          core=$(awk '/nx run @opentelemetry\/core:test/ {f=1; next} f && /^[[:space:]]*[0-9]+ passing/ {print $1 " passing"; exit}' seal-test.clean.log)
          echo "@opentelemetry/core: ${core}"
          test "${failing}" -eq 0

      - name: Pack @opentelemetry/core
        if: matrix.node_version == '22'
        run: |
          mkdir -p ./seal-dist
          npm pack --workspace=packages/opentelemetry-core --pack-destination=./seal-dist
          mv ./seal-dist/opentelemetry-core-2.6.1.tgz ./seal-dist/core-2.6.1.tgz

      - name: Upload @opentelemetry/core tarball
        if: matrix.node_version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: core-tgz
          path: seal-dist/core-2.6.1.tgz
          if-no-files-found: error
  node-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '22'

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        shell: bash
        run: npm run test 2>&1 | tee seal-test.log

      - name: Test summary
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' seal-test.log > seal-test.clean.log
          suites=$(awk '/^[[:space:]]*[0-9]+ passing/ {n++} END {print n+0}' seal-test.clean.log)
          passing=$(awk '/^[[:space:]]*[0-9]+ passing/ {s+=$1} END {print s+0}' seal-test.clean.log)
          failing=$(awk '/^[[:space:]]*[0-9]+ failing/ {s+=$1} END {print s+0}' seal-test.clean.log)
          pending=$(awk '/^[[:space:]]*[0-9]+ pending/ {s+=$1} END {print s+0}' seal-test.clean.log)
          echo "Mocha totals across ${suites} test runs: ${passing} passing, ${failing} failing, ${pending} pending"
          core=$(awk '/nx run @opentelemetry\/core:test/ {f=1; next} f && /^[[:space:]]*[0-9]+ passing/ {print $1 " passing"; exit}' seal-test.clean.log)
          echo "@opentelemetry/core: ${core}"
          test "${failing}" -eq 0
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:browser
  webworker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:webworker
